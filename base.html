<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DreamNest Surat - Premium Real Estate Marketplace{% endblock %}</title>
  <meta name="description" content="{% block description %}Discover premium apartments, luxury villas, plots, and commercial properties in Surat's prime locations like Vesu, Adajan, Pal, and Piplod. Buy or rent with DreamNest Surat.{% endblock %}">
  <meta name="keywords" content="Real Estate in Surat, Property in Surat, Flats in Surat, Villas in Surat, Buy Property in Surat, Rent Property in Surat, DreamNest Surat">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            accent: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
              950: '#451a03',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block extra_head %}{% endblock %}
  <!-- Theme Initialization Script -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'system';
      if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body class="bg-primary-950 text-slate-100 flex flex-col min-h-screen selection:bg-accent-500 selection:text-primary-950" 
      {% block body_attrs %}{% endblock %}>

  <!-- Navigation -->
  {% include 'partials/navbar.html' %}

  <!-- Main Content Layout -->
  {% block content %}{% endblock %}

  <!-- Footer -->
  {% include 'partials/footer.html' %}

  <!-- Lucide Icon Initialization -->
  <script>
    lucide.createIcons();
    // Re-render icons on HTMX swap
    document.body.addEventListener('htmx:afterSwap', function() {
      lucide.createIcons();
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
